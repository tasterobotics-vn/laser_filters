scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: polygon_filter
      type: laser_filters/LaserScanPolygonFilter
      params:
        polygon_frame: base_link
        polygon: "[[0.120, 0.275], [-0.120, 0.275], [-0.120, 0.245], [-0.270, 0.245], [-0.345, 0.080], [-0.345, -0.080], [-0.270, -0.245], [-0.120, -0.245], [-0.120, -0.275], [0.120, -0.275], [0.120, -0.245], [0.270, -0.245], [0.345, -0.080], [0.345, 0.080], [0.270, 0.245], [0.120, 0.245]]"
        invert: false
        footprint_topic: base_footprint_exclude
    filter2:
      name: angle_filter
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        # Laser scan receive angle from 135 degree to -135 degree
        #lower_angle: 0.78539816339     
        #upper_angle: -0.78539816339
        # Laser scan receive angle from 134 degree to -134 degree
        lower_angle: 0.802851456  
        upper_angle: -0.802851456      
